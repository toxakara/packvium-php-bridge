name: ci

on:
  push:
    branches: [main]
  pull_request:

# Least privilege by default; jobs that need more request it explicitly.
permissions:
  contents: read

jobs:
  # This package requires PHP >= 7.4 and means it: the bridge's own code runs there, and
  # so does every row below. `packvium/packvium` 0.1.3 declares `php: >=7.3` and ships
  # `src-legacy/` beside `src/`, so Composer resolves the dev dependency on every row and
  # `composer test` exercises the pure-PHP fallback path on all of them.
  #
  # Until 0.1.3 reached Packagist (2026-08-26) that was not true: the engine required
  # >= 8.2, so 7.4/8.0/8.1 could not resolve at all, and those three rows ran a reduced
  # check -- manifest validation plus a syntax pass -- behind an `engine-installable`
  # flag. The flag, its `include:` block and the reduced step are gone with the condition
  # that forced them.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["7.4", "8.0", "8.1", "8.2", "8.3", "8.4", "8.5"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
      - run: composer validate --strict --no-check-lock
      - name: Install
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Test
        run: composer test

  # Runs the same suite with ext-ffi loaded, so the native-library health check and the
  # unhealthy-library fallback path (both otherwise skipped) actually execute.
  test-with-ffi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: "8.3"
          coverage: none
          tools: composer:v2
          extensions: ffi
        env:
          # `ffi.enable` is off by default outside of CLI/embed SAPIs; setup-php's ffi
          # extension does not flip it, so this workflow does explicitly.
          phpts: nts
      - run: php -d ffi.enable=1 -r 'var_dump(extension_loaded("ffi"));'
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: php -d ffi.enable=1 tests/run.php

  # Fails a pull request that introduces a dependency with a known vulnerability or a
  # licence the project has not accepted. It reads GitHub's dependency graph, so it needs
  # nothing committed here beyond this job.
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: low
          comment-summary-in-pr: on-failure
